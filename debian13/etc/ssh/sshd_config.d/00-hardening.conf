#
# Hardening for the SSH server.
# Drop-in: /etc/ssh/sshd_config stays the untouched package default.
# sshd_config is first-match-wins and this directory is included at the top, so
# the settings below win over the rest of the file.
# Install: sudo install -m 644 00-hardening.conf /etc/ssh/sshd_config.d/00-hardening.conf
# Apply:   sudo sshd -t && sudo systemctl reload ssh
# Check:   sudo sshd -T | grep -E '^(permitrootlogin|passwordauthentication|maxauthtries|x11forwarding)'
#

# Don't allow logins as root over SSH.
PermitRootLogin no

# Public key authentication only: no passwords, no keyboard-interactive.
PubkeyAuthentication yes
PasswordAuthentication yes
KbdInteractiveAuthentication no
PermitEmptyPasswords no

# Log the fingerprint of the key that was accepted.
LogLevel VERBOSE

# Shorten the login window and limit the authentication attempts.
LoginGraceTime 30
MaxAuthTries 3
MaxSessions 4
MaxStartups 10:30:60

# Drop idle sessions. This runs inside the encrypted channel.
ClientAliveInterval 300
ClientAliveCountMax 2

# Disable X11, agent, TCP, socket and tunnel forwarding.
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
GatewayPorts no
PermitTunnel no
PermitUserEnvironment no

# Ignore .rhosts/.shosts and host-based authentication.
IgnoreRhosts yes
HostbasedAuthentication no

# Don't reverse-resolve the client address.
UseDNS no

# Enforce a minimum RSA key size of 3072 bits.
# OpenSSH 9.1 and later only. Debian 13 ships 10.0p2, so this is safe here.
RequiredRSASize 3072

# Restrict SSH logins to members of one group.
# WARNING: create the group and add your account before reloading, or you lock yourself out. Test from a second session before closing the first.
# groupadd sshusers
# usermod -aG sshusers <youruser>
# AllowGroups sshusers

# Require two factors (public key then TOTP) once libpam-google-authenticator is installed and every user is enrolled.
# AuthenticationMethods publickey,keyboard-interactive

# Listen on a non-standard port instead of 22.
# Open the port in the firewall before reloading, or you lock yourself out.
# On Debian 13 the default is ssh.service, so this keyword applies. If ssh.socket is enabled instead, set the port in the ssh.socket unit.
# Port 22

# --- Not an sshd_config keyword: one-off maintenance command. ---
# Regenerate /etc/ssh/moduli to keep only Diffie-Hellman groups of 3072 bits and larger, so the group-exchange KEX cannot fall back to a 2048-bit prime.
# The size column stores bits minus one, so a 3072-bit prime reads 3071.
# Debian 13 ships 432 entries, 60 of them below that and 372 at or above.
# cp --archive /etc/ssh/moduli /etc/ssh/moduli.bak.$(date +%Y%m%d%H%M%S)
# awk '$5 >= 3071' /etc/ssh/moduli > /tmp/moduli.new
# wc -l /tmp/moduli.new    # must not be 0
# mv /tmp/moduli.new /etc/ssh/moduli
# Run "systemctl restart ssh" after replacing the file.

# --- Left at the OpenSSH defaults on purpose. ---
# Ciphers, MACs and KexAlgorithms: the 10.0p2 defaults are stronger than the 2019 Mozilla "modern" lists still copied around in guides. Only override them with a concrete reason, for example to drop one legacy algorithm.
# HostKeyAlgorithms ssh-ed25519
# KexAlgorithms curve25519-sha256
# Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com
# MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com

# One keyword that disables X11, agent, TCP and StreamLocal forwarding at once, OpenSSH 7.4 and later.
# DisableForwarding yes
