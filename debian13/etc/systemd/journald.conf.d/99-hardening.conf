#
# Journal persistence for Debian 13.
# Drop-in: /etc/systemd/journald.conf and its section keywords stay untouched.
# Install: sudo install -D -m 644 99-hardening.conf /etc/systemd/journald.conf.d/99-hardening.conf
# Apply:   sudo systemctl restart systemd-journald
# Check:   journalctl --disk-usage
# ls /var/log/journal
#

[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=1G
SystemMaxFileSize=100M
