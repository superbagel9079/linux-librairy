#
# Hardening sysctl settings for Debian 13.
# Drop-in: the defaults in /usr/lib/sysctl.d and /etc/sysctl.d stay untouched.
# sysctl lives in /usr/sbin, absent from a normal user PATH, so call it with sudo.
# Install: sudo install -m 644 99-hardening.conf /etc/sysctl.d/99-hardening.conf
# Apply:   sudo sysctl --system
# Check:   sudo sysctl kernel.kptr_restrict
#          sudo sysctl kernel.yama.ptrace_scope fs.protected_fifos kernel.core_pattern
#

# Restrict kernel address and message exposure.
kernel.kptr_restrict=2
kernel.dmesg_restrict=1
kernel.perf_event_paranoid=3

# Restrict tracing and terminal discipline autoloading.
kernel.yama.ptrace_scope=1
dev.tty.ldisc_autoload=0

# Disable the kexec syscall and the magic SysRq key.
kernel.kexec_load_disabled=1
kernel.sysrq=0

# Restrict unprivileged BPF and harden the BPF JIT.
kernel.unprivileged_bpf_disabled=2
net.core.bpf_jit_harden=2

# File and directory protections.
fs.protected_hardlinks=1
fs.protected_symlinks=1
fs.protected_fifos=2
fs.protected_regular=2
fs.suid_dumpable=0

# Address space layout randomization.
kernel.randomize_va_space=2

# Disable core dumps for all processes, overriding systemd-coredump.
kernel.core_pattern=|/bin/false

# Network stack hardening.
net.ipv4.tcp_syncookies=1
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.secure_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.icmp_echo_ignore_broadcasts=1
net.ipv4.icmp_ignore_bogus_error_responses=1

# Ignore IPv6 router advertisements. Comment out if you use SLAAC.
net.ipv6.conf.all.accept_ra=0
net.ipv6.conf.all.accept_redirects=0
