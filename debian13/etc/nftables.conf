#!/usr/sbin/nft -f

#
# Hardening firewall for a Debian 13 host.
# This is /etc/nftables.conf itself; the package default has no rules and accepts everything.
# nft lives in /usr/sbin, absent from a normal user PATH, so call it with sudo.
# Install: sudo apt install nftables
# Apply:   sudo systemctl enable --now nftables
# Check:   sudo nft -c -f /etc/nftables.conf
#          sudo nft list ruleset
#

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;

		# Loopback and established traffic.
		iif lo accept
		ct state established,related accept
		ct state invalid drop

		# ICMP and ICMPv6 are needed for path MTU discovery.
		ip protocol icmp accept
		ip6 nexthdr ipv6-icmp accept

		# SSH, rate-limited to slow down brute force.
		# Change 22 if you moved the SSH port.
		tcp dport 22 ct state new limit rate 5/minute accept

		# Anything else is dropped and counted.
		counter drop
	}
	chain forward {
		type filter hook forward priority filter; policy drop;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
